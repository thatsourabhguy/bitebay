# Java keeps its own list of trusted certificate authorities, separate from
# Windows. Avast antivirus re-signs HTTPS traffic with its own certificate,
# which Windows trusts but Java does not - so Gradle downloads used to fail.
# This points Java at a copy of its trust store with the Avast root added.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djavax.net.ssl.trustStore=C:/Users/lenovo/.gradle/certs/cacerts-with-avast -Djavax.net.ssl.trustStorePassword=changeit
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
